  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const projects = {
        "1": {
          title: "Student Performance Prediction",
          image: "assets/img/portfolio/p4.jpg",
          overview: `<p class="cs_portfolio_text">Developed a predictive model using student academic data.</p>
                     <ul>
                       <li class="cs_portfolio_text">Performed data cleaning, preprocessing, and exploratory data analysis.</li>
                       <li class="cs_portfolio_text">Applied machine learning algorithms for prediction.</li>
                       <li class="cs_portfolio_text">Evaluated model performance using appropriate metrics.</li>
                     </ul>`,
          tools: "Python, Pandas, Matplotlib, Scikit-learn",
          type: "Machine Learning"
        },
        "2": {
          title: "Sales Dashboard using Power BI",
          image: "assets/img/portfolio/p5.jpg",
          overview: `<p class="cs_portfolio_text">Built an interactive dashboard to analyze sales performance.</p>
                     <ul>
                       <li class="cs_portfolio_text">Visualized key metrics such as revenue trends and sales distribution.</li>
                       <li class="cs_portfolio_text">Enabled better decision-making through data insights.</li>
                     </ul>`,
          tools: "Power BI, Excel",
          type: "Data Analytics"
        },
        "3": {
          title: "Portfolio Website",
          image: "assets/img/portfolio/p6.jpg",
          overview: `<p class="cs_portfolio_text">A personal portfolio website developed to showcase projects, skills, and resume.</p>
                     <ul>
                       <li class="cs_portfolio_text">Responsive design ensuring compatibility across all devices.</li>
                       <li class="cs_portfolio_text">Interactive elements and smooth scrolling.</li>
                       <li class="cs_portfolio_text">Contact form integration for easy communication.</li>
                     </ul>`,
          tools: "HTML5, CSS3, JavaScript, Bootstrap",
          type: "Web Development"
        }
      };

      const urlParams = new URLSearchParams(window.location.search);
      let projectId = urlParams.get('id');
      if (!projectId || !projects[projectId]) {
        projectId = "1"; // Default
      }

      const project = projects[projectId];

      document.getElementById('project-title-hero').innerText = project.title;
      document.getElementById('project-title').innerText = project.title;
      document.getElementById('project-image').src = project.image;
      document.getElementById('project-overview').innerHTML = project.overview;
      document.getElementById('project-tools').innerText = project.tools;
      document.getElementById('project-type').innerText = project.type;
      document.title = project.title + " - INBARASI M";

      // Tab switching logic
      const tabLinks = document.querySelectorAll('#project-tabs a');
      const tabContents = document.querySelectorAll('.project-tab-content');

      tabLinks.forEach(link => {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          const targetId = this.getAttribute('href').substring(1);

          // Update active class on links
          tabLinks.forEach(l => {
            l.classList.remove('active');
            l.style.background = '#f4f6f9';
            l.style.color = '#333';
          });
          this.classList.add('active');
          this.style.background = '#342ead';
          this.style.color = '#fff';

          // Show/Hide content
          tabContents.forEach(content => {
            if (content.id === targetId) {
              content.style.display = 'block';
            } else {
              content.style.display = 'none';
            }
          });
        });
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var toggle = document.getElementById('hero-theme-toggle');
      var hero = document.querySelector('.cs_hero');
      var isDark = true;
      toggle.addEventListener('click', function (e) {
        e.preventDefault();
        isDark = !isDark;
        if (isDark) {
          hero.style.backgroundImage = 'url(assets/img/bg/hero_bg_5.svg)';
          toggle.classList.remove('cs_light_page');
          toggle.classList.add('cs_dark_page');
          toggle.title = 'Switch to Light Theme';
        } else {
          hero.style.backgroundImage = 'url(assets/img/bg/hero_bg_4.svg)';
          toggle.classList.remove('cs_dark_page');
          toggle.classList.add('cs_light_page');
          toggle.title = 'Switch to Dark Theme';
        }
      });
    });
  </script>
